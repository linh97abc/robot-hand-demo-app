[package]
name = "robot-hand-rig"
version = "0.1.0"
description = "Mô hình bàn tay robot 5 ngón & 3 ngón — điều khiển từng khớp"
license = "MIT"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 16
lto = true
opt-level = "s"
strip = true
